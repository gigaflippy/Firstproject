services:
  pulsewatch:
    build: .
    environment:
      PULSEWATCH_REGION: ${PULSEWATCH_REGION:-local}
    volumes:
      # Uses targets.yaml if you set PULSEWATCH_TARGETS=./targets.yaml, otherwise the example.
      - ${PULSEWATCH_TARGETS:-./targets.example.yaml}:/config/targets.yaml:ro
      - pulsewatch-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - pulsewatch
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.2
    environment:
      # Local-only defaults: anonymous read-only viewing, admin/admin for editing.
      # Override GRAFANA_ADMIN_PASSWORD if the port is reachable from other machines.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulsewatch.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pulsewatch-data:
  grafana-data:
