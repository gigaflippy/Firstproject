services:
  pulsewatch:
    build: .
    environment:
      PULSEWATCH_REGION: ${PULSEWATCH_REGION:-local}
    volumes:
      # Uses targets.yaml if you set PULSEWATCH_TARGETS=./targets.yaml, otherwise the example.
      - ${PULSEWATCH_TARGETS:-./targets.example.yaml}:/config/targets.yaml:ro
      - pulsewatch-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - pulsewatch
    restart: unless-stopped

volumes:
  pulsewatch-data:
