groups:
  - name: pulsewatch.recording
    rules:
      - record: pulsewatch:uptime_ratio_1h
        expr: avg_over_time(pulsewatch_up[1h])
      - record: pulsewatch:latency_p95_seconds
        expr: |
          histogram_quantile(0.95,
            sum by (le, target, region) (rate(pulsewatch_probe_latency_seconds_bucket[5m])))

  - name: pulsewatch.alerts
    rules:
      # A target is only paged as down when every region that probes it agrees.
      # With a single region this is the same as "down from that region".
      - alert: TargetDown
        expr: max by (target) (pulsewatch_up) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }} is down from every region"
      # Down from some regions but up from others: a regional or network-path issue,
      # or a problem with the probe location itself. Worth a look, not a page.
      - alert: TargetDownInSomeRegions
        expr: |
          (pulsewatch_up == 0)
            and on (target) (max by (target) (pulsewatch_up) == 1)
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.target }} is down from {{ $labels.region }} but up elsewhere"
      - alert: TargetSlow
        expr: pulsewatch:latency_p95_seconds > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.target }} p95 latency above 2s from {{ $labels.region }}"
