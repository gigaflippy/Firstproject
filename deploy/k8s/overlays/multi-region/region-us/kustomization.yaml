apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulsewatch-us
resources:
  - namespace.yaml
  - ../../../base
images:
  - name: pulsewatch
    newName: pulsewatch
    newTag: dev
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pulsewatch
      spec:
        template:
          spec:
            containers:
              - name: pulsewatch
                env:
                  - name: PULSEWATCH_REGION
                    value: us-sim
