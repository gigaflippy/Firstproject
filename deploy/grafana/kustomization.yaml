# Lets Kubernetes reuse the exact files docker compose mounts (see deploy/k8s/monitoring).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-datasources
    files:
      - provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-providers
    files:
      - provisioning/dashboards/pulsewatch.yml
  - name: grafana-dashboards
    files:
      - dashboards/pulsewatch.json
